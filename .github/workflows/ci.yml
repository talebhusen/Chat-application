name: CI

on:
  push:
    branches:
      - 'feature/*'
      - 'dummy-App'

  pull_request:
    branches:
      - 'dummy-App'
      - 'master'

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: public/package-lock.json

      - name: Install frontend dependencies
        working-directory: public
        run: npm ci

      - name: Run frontend tests
        working-directory: public
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: public
        run: npm run build
        env:
          CI: false

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: server
        run: npm install

      - name: Verify backend
        working-directory: server
        run: node --check index.js